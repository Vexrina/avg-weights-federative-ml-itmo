services:
  postgres:
    container_name: postgre
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: metadata_user
      POSTGRES_PASSWORD: metadata_pwd
      POSTGRES_DB: metadata_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U metadata_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate:latest
    container_name: postgre_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://metadata_user:metadata_pwd@postgres:5432/metadata_db?sslmode=disable
    volumes:
      - ./migrations:/migrations
    command: [ "-path", "/migrations", "-database", "postgres://metadata_user:metadata_pwd@postgres:5432/metadata_db?sslmode=disable", "up" ]

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"  # S3 endpoint
      - "9001:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: minio_mc
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin12345;
      mc mb -p local/mybucket;
      mc policy set public local/mybucket;
      "

volumes:
  minio_data:
  postgres_data: